name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - if: matrix.node-version == 24
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/

  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: bash -n scripts/*.sh
      - run: swift format lint --recursive --strict Sources Tests Package.swift
      - run: swift test
      - run: swift build -c release --triple arm64-apple-macosx14.0 --scratch-path .build/ci-arm64
      - run: swift build -c release --triple x86_64-apple-macosx14.0 --scratch-path .build/ci-x86_64
